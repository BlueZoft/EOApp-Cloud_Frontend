plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Store signing information in an ignored file. The optional path override lets
// rehearsal builds use disposable identities without replacing operator keys.
def signingProperties = new Properties()
def signingFile = rootProject.file(System.getenv('EOAPP_SIGNING_PROPERTIES') ?: 'key.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def releaseApplicationId = signingProperties.getProperty('applicationId', 'com.example.flutter_frontend')
if (releaseRequested) {
    def requiredKeys = ['applicationId', 'storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    if (!signingFile.exists() || requiredKeys.any { !signingProperties.getProperty(it)?.trim() || signingProperties.getProperty(it).contains('REPLACE_WITH') }
            || releaseApplicationId == 'com.example.flutter_frontend') {
        throw new GradleException('Release identity/signing is not configured. Copy android/key.properties.example to android/key.properties and replace every placeholder. See docs/RELEASE.md.')
    }
}

android {
    namespace "com.example.flutter_frontend"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId releaseApplicationId
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile signingProperties.getProperty('storeFile') ? rootProject.file(signingProperties.getProperty('storeFile')) : null
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Never silently publish an APK signed with development keys.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
