name: flutter_frontend
description: Entrepreneur outreach loan catalogue and inquiries.
publish_to: 'none'
version: 1.2.0+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  cupertino_icons: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fscreen.jpg
    - assets/catalogue.json
  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
