name: eoapp
services:
  api:
    image: eoapp-api:${RELEASE_TAG:-local}
    build:
      context: ${BACKEND_CONTEXT:-../../EOApp-Cloud_Backend}
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGO_URI: ${MONGO_URI:?Supply a private database URI in .env.deploy}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Supply the public HTTPS origin}
      TRUST_PROXY_HOPS: '1'
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      STAFF_ENABLED: ${STAFF_ENABLED:-false}
      STAFF_COOKIE_SECURE: 'true'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [application]
  web:
    image: eoapp-web:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVER_NAME: ${SERVER_NAME:?Supply the public hostname}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Supply the public HTTPS origin}
    group_add: ['${TLS_READ_GID:-101}']
    volumes:
      - type: bind
        source: ${TLS_CERT_DIR:-./tls}
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
    ports:
      - '${HTTP_BIND:-127.0.0.1:8080}:8080'
      - '${HTTPS_BIND:-127.0.0.1:8443}:8443'
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [application]
networks:
  application: {}
